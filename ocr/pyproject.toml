[project]
name = "tehsil-ocr"
version = "0"
description = "Transcript page inventory, run as a child process or a Lambda (apps/documents/ocr.py)"
# The parser has its own interpreter (3.12, the Lambda base image's), so a malicious-PDF fix in
# pdfplumber/pypdfium2/pypdf never waits on the app's Python.
requires-python = "==3.12.*"
dependencies = [
    "pdfplumber==0.11.10",
    "pillow>=12.2,<13",
    "pypdf>=6.19.0,<7",
    "pypdfium2==5.14.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
python_files = ["test_*.py"]

[dependency-groups]
dev = [
    "pytest>=9.0.3,<10",
]
