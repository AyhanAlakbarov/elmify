{% extends "base.html" %}
{% block title %}Messages{% endblock %}
{% block content %}
  <div class="page-head"><div><h1>Messages</h1><p>Our team, and what universities and funders wrote to you.</p></div></div>
  {% include "student/_messages.html" %}
  <form class="panel composer" method="post" action="{% url 'concierge-send-student-message' %}">
    {% csrf_token %}
    <input type="hidden" name="return_to" value="messages">
    {% if error and error_form == "message" %}<p role="alert" id="message-error">{{ error }}</p>{% endif %}
    <p>
      <label for="message-body">{% if has_counselor %}Write to your counsellor{% else %}Write to the Elmify team{% endif %}</label><br>
      <textarea id="message-body" name="body" rows="4" maxlength="4000">{{ form_values.body }}</textarea>
    </p>
    <button type="submit">Send</button>
  </form>
{% endblock %}
