name: AWS Account Security (Prowler)

# Manual-only: dormant until this project has a live AWS account and an IAM
# role scoped for Prowler's read-only checks, assumable via OIDC (no static
# keys). Set up the role, add its ARN as the AWS_PROWLER_ROLE_ARN secret and
# the account's region as the AWS_REGION variable, then run from the
# Actions tab. Reusable as-is in other SaaS repos.
on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  prowler:
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_PROWLER_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Run Prowler
        # Pinned by digest — check https://hub.docker.com/r/toniblyx/prowler/tags
        # periodically and bump both the tag and digest together.
        uses: docker://toniblyx/prowler:5.39.0@sha256:64ff238bfaa6da041960dfeb55883dc966d650b527c12864895731e94af807b6
        with:
          args: aws --output-formats json-ocsf --output-directory /github/workspace/prowler-output
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: prowler-report
          path: prowler-output/
