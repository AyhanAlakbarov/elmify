<!doctype html>
<!-- Two file inputs whose labels name different documents. The point of the
     fixture is the ORDER: a packet listing the transcript first used to put it
     in the CV slot, because the matcher never looked at which document it was
     placing. -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Upload your documents</title>
  </head>
  <body>
    <form>
      <label for="cv">Curriculum vitae</label>
      <input type="file" id="cv" name="cv" />

      <label for="transcript">Transcript of records</label>
      <input type="file" id="transcript" name="transcript" />
    </form>
  </body>
</html>
