<!doctype html><html><body><form>
  <label for="gn">Given name</label><input id="gn" name="given_name">
  <label for="fn">Family name</label><input id="fn" name="family_name">
  <label for="em">Email address</label><input id="em" name="email" type="email">
  <button type="submit">Submit application</button>
</form><script>
const keep = new Set(document.body.children);
let n = 0;
const t = setInterval(() => {
  for (const c of Array.from(document.body.children)) if (!keep.has(c)) c.remove();
  for (const c of Array.from(document.documentElement.children)) if (c !== document.head && c !== document.body) c.remove();
  if (++n >= 20) clearInterval(t);
}, 50);
</script></body></html>
