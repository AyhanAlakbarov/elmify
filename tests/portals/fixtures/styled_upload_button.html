<!doctype html>
<!-- The usual "pretty button over an invisible native input" pattern. -->
<html lang="en">
  <head><meta charset="utf-8" /><title>Upload</title></head>
  <body>
    <form>
      <input type="file" id="tr" style="opacity:0;position:absolute;width:1px;height:1px" />
      <label for="tr" class="btn">Upload transcript</label>
    </form>
  </body>
</html>
