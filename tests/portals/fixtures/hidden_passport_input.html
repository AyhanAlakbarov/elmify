<!doctype html>
<!-- A hidden "Passport" box with no visible label: nothing the student can see. -->
<html lang="en">
  <head><meta charset="utf-8" /><title>Upload</title></head>
  <body>
    <form>
      <label for="cv">Upload CV</label>
      <input type="file" id="cv" />
      <input type="file" id="hidden_passport" aria-label="Passport" style="display:none" />
    </form>
  </body>
</html>
