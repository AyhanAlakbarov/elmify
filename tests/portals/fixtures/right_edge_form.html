<!doctype html><html><body style="margin:0"><form>
  <!-- Task 6: a field flush with the right edge, and one as wide as the page. -->

    <label for="gn">Given name</label><input id="gn" name="given_name" style="width:280px">
  </div>
  <div style="position:absolute; left:0; right:0; top:120px">

    <input id="fn" name="family_name" style="display:block; width:100%; box-sizing:border-box">
  </div>
