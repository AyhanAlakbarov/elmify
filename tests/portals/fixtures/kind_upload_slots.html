<!doctype html>
<!-- Upload boxes named by what they take, so documents are matched by kind. -->
<html lang="en">
  <head><meta charset="utf-8" /><title>Upload</title></head>
  <body>
    <form>
      <label for="cv">Upload CV</label>
      <input type="file" id="cv" />
      <label for="passport">Passport scan</label>
      <input type="file" id="passport" />
    </form>
  </body>
</html>
