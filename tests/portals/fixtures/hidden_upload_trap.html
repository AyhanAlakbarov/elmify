<!doctype html>
<!-- A visible CV box, and a hidden "Transcript" box with no visible label: a
     hacked portal could use the second to collect a document the student never
     saw being attached. -->
<html lang="en">
  <head><meta charset="utf-8" /><title>Upload</title></head>
  <body>
    <form>
      <label for="cv">Upload CV</label>
      <input type="file" id="cv" />
      <input type="file" aria-label="Transcript" style="display:none" />
    </form>
  </body>
</html>
